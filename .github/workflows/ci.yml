name: C++ CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Configure and Build
      run: |
        cmake -B build -DCMAKE_CXX_STANDARD=20
        cmake --build build
    
    - name: Run Tests
      run: |
        cd build && ctest --output-on-failure
