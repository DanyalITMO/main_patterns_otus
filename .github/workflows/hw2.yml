name: homework2

on:
  push:
    paths:
      - 'hw2/**'
    branches: [ hw2 ]

  pull_request:
    paths:
      - 'hw2/**'
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure and Build
        run: |
          cd hw2
          cmake -B build -DCMAKE_CXX_STANDARD=20
          cmake --build build

      - name: Run Tests
        run: |
          cd hw2/build && ctest --output-on-failure
